<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직영 사전교육자 명단 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', dotum, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #333; font-size: 20px; margin-top: 0; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; resize: vertical; font-size: 14px; margin-bottom: 10px; }
        .btn { padding: 12px 24px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 10px; transition: 0.2s; }
        .btn-blue { background-color: #0056b3; }
        .btn-blue:hover { background-color: #004494; }
        .btn-green { background-color: #28a745; opacity: 0.5; cursor: not-allowed; }
        .btn-green.active { opacity: 1; cursor: pointer; }
        .btn-green.active:hover { background-color: #218838; }
        
        .table-responsive { overflow-x: auto; margin-top: 25px; display: block; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 13px; background-color: #fff; }
        th, td { border: 1px solid #bbb; padding: 10px 8px; text-align: center; height: 20px; }
        th { background-color: #a9c9e9; color: #111; font-weight: bold; }
        .th-merged { letter-spacing: 2px; }
        
        td.editable { cursor: text; transition: 0.2s; }
        td.editable:focus { outline: 2px solid #ffc107; background-color: #fff; }
        .help-text { font-size: 12px; color: #666; margin-top: -5px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 직영 사전교육자 명단 자동 변환기</h2>
    <span class="help-text">카카오톡으로 전달받은 텍스트 양식을 아래 빈칸에 모두 붙여넣고 변환 버튼을 누르세요.</span>
    
    <textarea id="inputText" placeholder="1. 성함 : &#10;2. 성별 : &#10;3. 나이 : &#10;... (이곳에 내용을 붙여넣으세요)"></textarea>
    
    <div>
        <button class="btn btn-blue" onclick="processText()">데이터 변환 및 미리보기</button>
        <button id="downloadBtn" class="btn btn-green" onclick="downloadExcel()" disabled>엑셀 다운로드</button>
    </div>

    <div class="table-responsive" id="tableContainer">
        <table id="previewTable">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>담당자<br>(수정가능)</th>
                    <th>현장명<br>(수정가능)</th>
                    <th>사전교육일</th>
                    <th>물산교육일</th>
                    <th>성별</th>
                    <th>성명</th>
                    <th colspan="2" class="th-merged">주민번호</th>
                    <th>전화번호</th>
                    <th>은행명</th>
                    <th>예금주</th>
                    <th>예금주와 관계</th>
                    <th>계좌번호</th>
                    <th>주소</th>
                    <th>숙소사용</th>
                    <th>혈액형</th>
                    <th>기종</th>
                    <th>건설경력</th>
                    <th>하이테크경력</th>
                    <th>장화감 경력</th>
                    <th>평택거주</th>
                    <th>특이사항<br>(수정가능)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 초기 로딩 시 자바스크립트로 빈칸 생성 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = [];
    let maxDateObj = new Date(0);

    window.onload = function() {
        const tbody = document.querySelector('#previewTable tbody');
        tbody.innerHTML = '';
        for(let i=1; i<=10; i++) {
            tbody.innerHTML += `
                <tr>
                    <td>${i}</td>
                    <td class="editable"></td><td class="editable"></td>
                    <td></td><td></td><td></td><td></td><td></td><td></td>
                    <td></td><td></td><td></td><td></td><td></td><td style="text-align:left;"></td>
                    <td></td><td></td><td></td><td></td><td></td><td></td>
                    <td></td><td class="editable"></td>
                </tr>
            `;
        }
    };

    function processText() {
        const text = document.getElementById('inputText').value;
        if (!text.trim()) return alert("변환할 텍스트를 입력해주세요.");

        const people = text.split(/(?=1\.\s*성함\s*:)/).filter(p => p.trim().length > 0);
        globalData = [];
        maxDateObj = new Date(0);

        people.forEach((pStr, index) => {
            const lines = pStr.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            let dataMap = {};
            let currentKey = "";

            lines.forEach(line => {
                const match = line.match(/^(\d+)\.\s*([^:]+)\s*:\s*(.*)/);
                if (match) {
                    currentKey = match[2].replace(/\s+/g, '');
                    dataMap[currentKey] = match[3].trim();
                } else if (currentKey) {
                    dataMap[currentKey] += " " + line; 
                }
            });

            const name = dataMap['성함'] || '';
            const gender = (dataMap['성별'] || '').includes('여') ? '여' : '남';
            
            const juminRaw = (dataMap['주민번호(뒷자리포함)'] || dataMap['주민번호'] || '').replace(/[^0-9]/g, '');
            const jumin1 = juminRaw.substring(0, 6);
            const jumin2 = juminRaw.substring(6, 13);
            
            const phone = dataMap['연락처'] || '';
            
            // 은행명 및 계좌번호 정밀 파싱 (띄어쓰기 및 줄바꿈 대응)
            const accRaw = (dataMap['계좌번호(본인)'] || dataMap['계좌번호'] || '').trim();
            let bank = '';
            const bankMatch = accRaw.match(/^([가-힣a-zA-Z\s]+)/); // 문자가 등장하는 앞부분 전체 추출
            if (bankMatch) {
                bank = bankMatch[1].replace(/\s+/g, ''); // 추출한 글자 안의 공백 제거
                if (bank.includes('카카오')) bank = '카카오';
            }
            const accNum = accRaw.replace(/[^\d-]/g, '').replace(/^-+|-+$/g, '');

            const address = dataMap['주소'] || '';
            const isPyeongtaek = address.includes('평택') ? 'O' : 'X';
            const isDorm = (dataMap['숙소or출퇴근'] || '').includes('숙소') ? 'O' : 'X';
            const bloodRaw = dataMap['혈액형'] || '';
            const blood = bloodRaw ? 'RH+' + bloodRaw.toUpperCase().replace('RH+', '') : '';

            const dateStr = dataMap['투입가능일자'] || '';
            let parsedDate = new Date();
            const dateMatch = dateStr.match(/(\d+)월\s*(\d+)일/);
            if(dateMatch) {
                const y = new Date().getFullYear();
                parsedDate = new Date(y, parseInt(dateMatch[1])-1, parseInt(dateMatch[2]));
                if (parsedDate > maxDateObj) maxDateObj = parsedDate;
            }

            globalData.push({
                no: index + 1,
                manager: '송상엽',
                site: 'P5',
                eduDate: dateStr,
                eduDateObj: parsedDate,
                gender: gender,
                name: name,
                jumin1: jumin1,
                jumin2: jumin2,
                phone: phone,
                bank: bank,
                accName: name, 
                accRel: '본인',
                accNum: accNum,
                address: address,
                dorm: isDorm,
                blood: blood,
                phoneModel: dataMap['핸드폰기종'] || '',
                expCon: dataMap['타건설현장경력'] || dataMap['타건설현장력'] || '',
                expHigh: dataMap['삼성건설현장경력'] || '',
                expFire: dataMap['화기감시자경력'] || '',
                pyeongtaek: isPyeongtaek,
                note: '' 
            });
        });

        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector('#previewTable tbody');
        tbody.innerHTML = '';
        
        if(globalData.length > 0) {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.classList.add('active');
        }

        globalData.forEach((row, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.no}</td>
                <td class="editable" contenteditable="true" onblur="updateField(${i}, 'manager', this.innerText)">${row.manager}</td>
                <td class="editable" contenteditable="true" onblur="updateField(${i}, 'site', this.innerText)">${row.site}</td>
                <td>${row.eduDate}</td>
                <td></td>
                <td>${row.gender}</td>
                <td>${row.name}</td>
                <td>${row.jumin1}</td>
                <td>${row.jumin2}</td>
                <td>${row.phone}</td>
                <td>${row.bank}</td>
                <td>${row.accName}</td>
                <td>${row.accRel}</td>
                <td>${row.accNum}</td>
                <td style="text-align:left;">${row.address}</td>
                <td>${row.dorm}</td>
                <td>${row.blood}</td>
                <td>${row.phoneModel}</td>
                <td>${row.expCon}</td>
                <td>${row.expHigh}</td>
                <td>${row.expFire}</td>
                <td>${row.pyeongtaek}</td>
                <td class="editable" contenteditable="true" onblur="updateField(${i}, 'note', this.innerText)">${row.note}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateField(index, key, value) {
        globalData[index][key] = value.trim();
    }

    async function downloadExcel() {
        if(globalData.length === 0) return alert('변환할 데이터가 없습니다.');
        
        try {
            // 새로 지정하신 템플릿(1_3)을 불러옵니다.
            const response = await fetch('./DHR_직영사전교육자명단_20260930_1_3.xlsx');
            if(!response.ok) throw new Error('Template file not found.');
            
            const arrayBuffer = await response.arrayBuffer();
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(arrayBuffer);
            const worksheet = workbook.worksheets[0];

            const m = maxDateObj.getMonth() + 1;
            const d = maxDateObj.getDate();
            worksheet.name = `${m}월 ${d}일`;

            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const titleDateStr = `${maxDateObj.getFullYear()}년 ${String(m).padStart(2,'0')}월 ${String(d).padStart(2,'0')}일 (${days[maxDateObj.getDay()]})`;
            
            // XML 에러 방지를 위해 코드 상의 mergeCells()를 모두 삭제했습니다. 
            // 값만 B2에 밀어넣고 서식/병합은 원본 템플릿의 형태를 완벽히 따릅니다.
            worksheet.getCell('B2').value = `[P5] ${titleDateStr} 사전교육명단`;

            let currentRow = 4;
            globalData.forEach(row => {
                worksheet.getCell(`B${currentRow}`).value = row.no;
                worksheet.getCell(`C${currentRow}`).value = row.manager;
                worksheet.getCell(`D${currentRow}`).value = row.site;
                worksheet.getCell(`E${currentRow}`).value = row.eduDateObj; 
                worksheet.getCell(`F${currentRow}`).value = '';
                worksheet.getCell(`G${currentRow}`).value = row.gender;
                worksheet.getCell(`H${currentRow}`).value = row.name;

                const cellI = worksheet.getCell(`I${currentRow}`);
                cellI.value = row.jumin1;
                cellI.numFmt = '@'; 
                
                const cellJ = worksheet.getCell(`J${currentRow}`);
                cellJ.value = row.jumin2;
                cellJ.numFmt = '@';

                const cellK = worksheet.getCell(`K${currentRow}`);
                cellK.value = row.phone;
                cellK.numFmt = '@';

                worksheet.getCell(`L${currentRow}`).value = row.bank;
                worksheet.getCell(`M${currentRow}`).value = row.accName;
                worksheet.getCell(`N${currentRow}`).value = row.accRel;

                const cellO = worksheet.getCell(`O${currentRow}`);
                cellO.value = row.accNum;
                cellO.numFmt = '@';

                worksheet.getCell(`P${currentRow}`).value = row.address;
                worksheet.getCell(`Q${currentRow}`).value = row.dorm;
                worksheet.getCell(`R${currentRow}`).value = row.blood;
                worksheet.getCell(`S${currentRow}`).value = row.phoneModel;
                worksheet.getCell(`T${currentRow}`).value = row.expCon;
                worksheet.getCell(`U${currentRow}`).value = row.expHigh;
                worksheet.getCell(`V${currentRow}`).value = row.expFire;
                worksheet.getCell(`W${currentRow}`).value = row.pyeongtaek;
                worksheet.getCell(`X${currentRow}`).value = row.note;

                currentRow++;
            });

            // ⚠️ 요청하신 셀 글자 잘림 방지를 위해 열 너비를 넉넉하게 강제 조절합니다.
            worksheet.getColumn('E').width = 14;   // 사전교육일 (###### 방지)
            worksheet.getColumn('I').width = 9.6;  // 주민번호 앞
            worksheet.getColumn('J').width = 9.6;  // 주민번호 뒤
            worksheet.getColumn('K').width = 15;   // 전화번호
            worksheet.getColumn('L').width = 10;   // 은행명
            worksheet.getColumn('M').width = 10;   // 예금주
            worksheet.getColumn('N').width = 14;   // 예금주와 관계 (글자 잘림 방지)
            worksheet.getColumn('O').width = 22;   // 계좌번호 (글자 잘림 방지)
            worksheet.getColumn('P').width = 45;   // 주소 (글자 잘림 방지)

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const yyyy = maxDateObj.getFullYear();
            const mm = String(m).padStart(2, '0');
            const dd = String(d).padStart(2, '0');
            const fileName = `DHR_직영사전교육자명단_${yyyy}${mm}${dd}.xlsx`;
            
            saveAs(blob, fileName);

            setTimeout(() => {
                alert('엑셀 다운로드가 완료되었습니다!');
            }, 500);

        } catch (error) {
            console.error(error);
            alert("⚠️ 엑셀 템플릿(DHR_직영사전교육자명단_20260930_1_3.xlsx) 파일을 찾을 수 없습니다!\n\n해당 원본 엑셀 파일을 Github 저장소에 업로드 해주셔야 기존 서식이 유지됩니다.");
        }
    }
</script>
</body>
</html>
